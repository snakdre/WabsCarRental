worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;

  # Document uploads go through server actions (up to 10 MB + form overhead,
  # see next.config.mjs serverActions.bodySizeLimit).
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Basic abuse protection on auth endpoints and server actions.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream next_app {
    server app:3000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # HTTP: health probe + redirect everything else to HTTPS.
  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;

    # Immutable build assets: cache hard at the edge.
    location /_next/static/ {
      proxy_pass http://next_app;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    location ~ ^/(login|register|forgot-password|reset-password) {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://next_app;
    }

    location / {
      proxy_pass http://next_app;
    }
  }
}
